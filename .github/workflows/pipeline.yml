name: Github Actions Example


on:
  push:
    branches:
      - main   
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Node 16 sample
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run eslint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

      - name: E2E Test
        uses: cypress-io/github-action@v6
        with:
          
          # 1. Comando para levantar tu servidor local en segundo plano
          start: npm run start-test 
          
          # 2. Espera a que el puerto 8080 responda antes de abrir Cypress
          wait-on: 'http://localhost:5000' 
          
          # 3. Tiempo límite para que el servidor responda (en segundos)
          wait-on-timeout: 300
          
          # 4. Ejecuta las pruebas E2E en modo headless
          command: npm run test:e2e